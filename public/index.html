<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Card Table</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="joinScreen" class="join-screen">
      <form id="joinForm" class="join-box" action="#" onsubmit="return false">
        <h1>Free Card Table</h1>
        <label>
          Name
          <input id="nameInput" autocomplete="name" maxlength="18" placeholder="Player" />
        </label>
        <label>
          Room code
          <input id="roomInput" maxlength="16" placeholder="TABLE" />
        </label>
        <label>
          Seat
          <select id="seatInput">
            <option value="">Any open seat</option>
            <option value="0">Bottom</option>
            <option value="1">Right</option>
            <option value="2">Top</option>
            <option value="3">Left</option>
          </select>
        </label>
        <p id="joinStatus" class="join-status">Loading multiplayer connection...</p>
        <button type="submit">Join table</button>
      </form>
    </div>

    <main class="game-shell">
      <aside class="side-panel">
        <button id="resetButton" class="danger" type="button">Reset game</button>
        <button id="distributeButton" type="button">Distribute</button>
        <div class="info-box">
          <span>Room</span>
          <strong id="roomCode">----</strong>
          <button id="copyLinkButton" type="button">Copy link</button>
        </div>
        <div class="info-box">
          <span>You are</span>
          <strong id="seatName">Not seated</strong>
        </div>
        <p>Left click flips. Right click and drag moves cards.</p>
      </aside>

      <section id="table" class="table-area" aria-label="Card table">
        <div class="felt-ring"></div>
        <div class="deck-label">Face-down deck</div>
        <div class="seat seat-bottom" data-seat="0">
          <span class="seat-name">Bottom</span>
          <div class="hand-zone" data-seat="0"></div>
        </div>
        <div class="seat seat-right" data-seat="1">
          <span class="seat-name">Right</span>
          <div class="hand-zone" data-seat="1"></div>
        </div>
        <div class="seat seat-top" data-seat="2">
          <span class="seat-name">Top</span>
          <div class="hand-zone" data-seat="2"></div>
        </div>
        <div class="seat seat-left" data-seat="3">
          <span class="seat-name">Left</span>
          <div class="hand-zone" data-seat="3"></div>
        </div>
        <div id="cardsLayer" class="cards-layer"></div>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
